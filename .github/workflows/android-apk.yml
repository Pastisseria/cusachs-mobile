name: Generar Cusachs APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación web para Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Generar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Preparar Cusachs.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Cusachs.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Cusachs-Android-APK
          path: Cusachs.apk
          retention-days: 30
